name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: InstalloryCore
    # Package.swift declares swift-tools-version 6.1, which needs Xcode 16.3+.
    # The macOS 15 image supplies a compatible Xcode toolchain.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Check product invariants
        run: ./scripts/check-invariants.sh

      - name: Show toolchain
        run: swift --version

      - name: Build
        working-directory: Installory
        run: swift build

      - name: Test XCTest
        working-directory: Installory
        run: swift test --no-parallel --disable-swift-testing

      - name: Test Swift Testing
        working-directory: Installory
        run: swift test --no-parallel --disable-xctest

      # Generated cleanup scripts are written (never run) and linted.
      - name: Lint generated scripts with shellcheck
        working-directory: Installory
        run: |
          INSTALLORY_SCRIPT_SAMPLES_DIR="$RUNNER_TEMP/scripts" \
            swift test --disable-xctest --filter GeneratedScriptSamplesTests
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck -S warning "$RUNNER_TEMP"/scripts/*.sh

  app:
    name: InstalloryApp
    runs-on: macos-15
    env:
      XCODEGEN_VERSION: "2.45.4"
      XCODEGEN_SHA256: "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"

    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode toolchain
        run: xcodebuild -version

      - name: Install pinned XcodeGen
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Regenerate Xcode project
        run: ./scripts/regenerate-xcode.sh

      - name: Verify generated product invariants
        run: ./scripts/check-invariants.sh

      # xcodebuild relaunches a crashed test host and can still report
      # success (newer Xcode versions don't even log it), so the step also
      # fails on a restart line or on a new Installory crash report.
      - name: Test app (Debug)
        run: |
          set -o pipefail
          crash_dir="$HOME/Library/Logs/DiagnosticReports"
          touch "$RUNNER_TEMP/app-test-start"
          xcodebuild \
            -project Installory.xcodeproj \
            -scheme Installory \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/app-test.log"
          sleep 5 # crash reports are written a moment after the process dies
          crashes=$(find "$crash_dir" -name 'Installory*' -newer "$RUNNER_TEMP/app-test-start" 2>/dev/null || true)
          if grep -q "Restarting after unexpected exit" "$RUNNER_TEMP/app-test.log" || [ -n "$crashes" ]; then
            echo "::error::The app test host crashed during the run, even though xcodebuild may report success."
            echo "$crashes"
            exit 1
          fi

      - name: Build app (Release)
        run: >-
          xcodebuild
          -project Installory.xcodeproj
          -scheme Installory
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      # What the compiled app imports, links and embeds: no subprocess,
      # socket or URL-loading symbols, no network frameworks, allowed web
      # addresses only.
      - name: Check the built app's invariants
        run: ./scripts/check-invariants.sh --binary "$RUNNER_TEMP/DerivedData/Build/Products/Release/Installory.app"
