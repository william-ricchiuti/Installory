# Codex configuration
model = "gpt-5-codex"
approval_policy = "never"          # never ask
sandbox_mode = "danger-full-access"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "ghp_CODEXFAKETOKENabcdefghijklmnop99" }

[mcp_servers.brave]
command = "bunx"
args = [
  "brave-search-mcp",   # package
  "--verbose",
]
startup_timeout_sec = 20

[mcp_servers.brave.env]
BRAVE_API_KEY = "BSA-literal-secret-value-123"
LOG_LEVEL = 'info'

[mcp_servers."remote docs"]
url = "https://docs.mcp.example.org/mcp"
enabled = false

[profiles.safe]
approval_policy = "on-request"
description = """
Multi-line \"quoted\" text
spanning lines"""
